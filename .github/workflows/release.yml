# A pet-vX.Y.Z tag builds projects/pet without secrets.h and publishes one merged image plus manifest.json, which the
# Workbench flasher installs from (#51). Other tags and pushes do nothing.
name: Release

on:
  push:
    tags: ["pet-v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      IDF_IMAGE: espressif/idf:v5.5.5
    steps:
      - uses: actions/checkout@v4

      - name: Version from the tag
        run: |
          v="${GITHUB_REF_NAME#pet-v}"
          if ! [[ "$v" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::tag must be pet-vX.Y.Z, got $GITHUB_REF_NAME"
            exit 1
          fi
          if [ -e projects/pet/main/secrets.h ]; then
            echo "::error::projects/pet/main/secrets.h is in the repo; a release must not carry it"
            exit 1
          fi
          echo "VERSION=$v" >> "$GITHUB_ENV"
          # ESP-IDF takes PROJECT_VER from version.txt, so the app (hello, pet/ota) reports the tag's version.
          echo "$v" > projects/pet/version.txt

      - name: Manifest tests
        run: python3 -m unittest discover tools

      - name: Build and merge
        run: |
          docker run --rm -v "$PWD:/project" -w /project "$IDF_IMAGE" bash -c '
            set -e
            git config --global --add safe.directory "*"
            idf.py -C projects/pet build
            python tools/make_manifest.py --build projects/pet/build --version "'"$VERSION"'" --out dist
          '
          ls -l dist

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          image="dist/desk-pet-esp32p4-rev1-v${VERSION}.bin"
          offset=$(python3 -c "import json; print(hex(json.load(open('dist/manifest.json'))['parts'][0]['offset']))")
          cat > notes.md <<EOF
          Desk pet firmware ${VERSION} for the Waveshare ESP32-P4 4-inch box, ESP32-P4 revision 1.x only.

          Install it from the Workbench flasher, or with esptool:

              esptool.py --chip esp32p4 -b 921600 write_flash ${offset} desk-pet-esp32p4-rev1-v${VERSION}.bin

          \`manifest.json\` describes the image for the flasher.
          EOF
          gh release create "$GITHUB_REF_NAME" "$image" dist/manifest.json --title "Desk pet ${VERSION}" --notes-file notes.md
